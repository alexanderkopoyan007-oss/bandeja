name = "bandeja-rooms"
main = "room.js"
compatibility_date = "2026-10-01"

[durable_objects]
bindings = [{ name = "ROOM", class_name = "Room" }, { name = "QUEUE", class_name = "Queue" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Queue"]

[observability]
enabled = false
