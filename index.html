<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="BANDEJA: a padel game in the browser. Doubles and singles, real padel physics, glass and mesh, the FIP's rules." />
    <meta name="theme-color" content="#0d1420" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <title>BANDEJA · Padel</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d0f12; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #hud { position: fixed; inset: 0; pointer-events: none; font: 13px/1.3 ui-sans-serif, system-ui, sans-serif; color: #e8ecef; zoom: var(--ui-scale, 1); }
      /* A game's own HUD layer hides while a menu pauses it. */
      #hud .layer { transition: opacity .2s; }
      #hud .layer.paused { opacity: 0; }
      /* The loading screen's first paint, before any script has run (src/ui/loading.ts takes it over). */
      #loading { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at 50% 38%, #18324f 0%, #0d1420 55%, #07090d 100%); }
      #loading .mark { font: italic 800 min(13vw, 120px)/1 "Avenir Next Condensed", "DIN Condensed", "Arial Narrow", system-ui, sans-serif;
        letter-spacing: .06em; color: #fff; }
      #loading .mark b { color: #ffd84a; }
    </style>
  </head>
  <body>
    <div id="loading"><div class="mark">BANDEJA<b>.</b></div></div>
    <div id="hud"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
